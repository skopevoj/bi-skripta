# Next.js static export: /kapitola/1/1 → kapitola/1/1.html, unknown paths → 404.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/x-component;

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # pdf.js worker is an ES module: browsers require a JavaScript MIME type.
  location ~* \.mjs$ {
    types {}
    default_type application/javascript;
  }
  error_page 404 /404.html;
}
